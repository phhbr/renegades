<form [formGroup]="tryoutForm" (ngSubmit)="onSubmit()" class="bg-secondary-dark dark:bg-dark-surface rounded-xl border border-gray-100 dark:border-white/8 p-8">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'training.tryout.form.name' | translate }} *</label>
      <input
        type="text"
        formControlName="name"
        class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      >
    </div>
    <div>
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'training.tryout.form.email' | translate }} *</label>
      <input
        type="email"
        formControlName="email"
        required
                class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      >
    </div>
    <div>
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'training.tryout.form.phone' | translate }}</label>
      <input
        type="tel"
        formControlName="phone"
        class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      >
    </div>
    <div>
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'training.tryout.form.age' | translate }}</label>
      <input
        type="number"
        formControlName="age"
        class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      >
    </div>
    <div class="md:col-span-2">
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'training.tryout.form.experience' | translate }}</label>
      <textarea
        formControlName="experience"
        rows="4"
        class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      ></textarea>
    </div>
    <div class="md:col-span-2">
      <label class="block mb-2 font-medium text-primary dark:text-white">{{ 'contact.form.message' | translate }}</label>
      <textarea
        formControlName="message"
        rows="6"
        class="w-full p-3 rounded-lg bg-secondary dark:bg-dark-secondary text-primary dark:text-white border border-gray-200 dark:border-white/10 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-shadow"
      ></textarea>
    </div>
  </div>
  <!-- Success Message -->
  @if (submitSuccess()) {
    <div class="p-4 bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-100 rounded-lg mt-4">
      {{ 'training.tryout.form.success_message' | translate }}
    </div>
  }

  <!-- Error Message -->
  @if (submitError()) {
    <div class="p-4 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-100 rounded-lg mt-4">
      {{ 'training.tryout.form.error_message' | translate }}
    </div>
  }

  <button
    type="submit"
    [disabled]="!tryoutForm.valid || isSubmitting()"
    class="mt-6 w-full bg-accent text-white py-3 rounded-full font-semibold tracking-wide shadow-md hover:bg-accent-dark hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-md"
  >
    @if (isSubmitting()) {
      {{ 'training.tryout.form.submitting' | translate }}
    } @else {
      {{ 'training.tryout.form.submit' | translate }}
    }
  </button>
</form>
